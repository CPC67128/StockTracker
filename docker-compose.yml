version: '3.8'

services:
  stocktracker:
    build: .
    container_name: stocktracker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  stocktracker-ui:
    build: .
    container_name: stocktracker-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - TZ=UTC
    command: ["streamlit", "run", "src/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
